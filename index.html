    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Entgegen – Bibel lesen und verstehen</title>
    <script>
      // Theme vor dem ersten Rendern setzen, damit kein heller Blitz entsteht.
      // Der frühere Schlüssel wird mitgelesen: Wer die App noch unter dem alten
      // Namen benutzt hat, soll seine Einstellung behalten.
      (function () {
        try {
          var raw =
            localStorage.getItem('entgegen.settings') || localStorage.getItem('lumina.settings');
          var s = JSON.parse(raw || '{}');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = s.theme || (dark ? 'dunkel' : 'hell');
          if (s.fontScale) document.documentElement.style.setProperty('--font-scale', s.fontScale);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
